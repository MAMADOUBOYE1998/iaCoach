name: Deploy PWA to Pages

# Why this exists: `getUserMedia` needs a secure context, so the camera cannot be
# tested over a plain LAN address. The documented workaround is Chrome DevTools
# port forwarding — which needs a computer. This job removes that requirement:
# GitHub builds the PWA and serves it over HTTPS, so a phone alone is enough to
# run a real session and fill in the latency table in docs/BENCHMARKS.md.
#
# Only the PWA is deployed. There is no backend behind it, and that is fine:
# counting and form scoring are entirely on-device. Sessions queue locally and
# the debrief simply reports itself unavailable. No API key is involved anywhere
# in this job.
#
# One manual step, once: Settings → Pages → Source: "GitHub Actions".
# Direct link: https://github.com/MAMADOUBOYE1998/iaCoach/settings/pages
# (the GitHub mobile app has no Pages screen — open it in a browser.)
#
# `enablement: true` below asks the action to create the site itself. It is kept
# because it turns an opaque "Not Found" into an explicit permission error, but
# it does not remove the manual step: the workflow token is refused with
# "Resource not accessible by integration", and no permission that a workflow can
# declare grants site creation. Until the setting is flipped, this job fails
# instead of publishing.

on:
  push:
    branches: ["claude/coach-ia-solo-architecture-f58qw5"]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy: a half-published site is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Vendors the model and the WASM runtime into the artifact. Without this
      # the deployed app pulls ~20 MB from a CDN on every cold start and cannot
      # work offline — the two things vendoring exists to prevent.
      - run: npm run vendor-assets
      - run: npm run build
        env:
          # The repository name: Pages serves the site from /<repo>/.
          BASE_PATH: /${{ github.event.repository.name }}/
      # `enablement` creates the Pages site itself (build_type: workflow) instead
      # of failing when it does not exist yet. Without it the first run dies on
      # "Get Pages site failed — Not Found", which is a settings toggle nobody
      # can guess from that message.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
