name: Deploy PWA to Pages

# Why this exists: `getUserMedia` needs a secure context, so the camera cannot be
# tested over a plain LAN address. The documented workaround is Chrome DevTools
# port forwarding — which needs a computer. This job removes that requirement:
# GitHub serves the PWA over HTTPS, so a phone alone is enough to run a real
# session and fill in the latency table in docs/BENCHMARKS.md.
#
# Deploys by pushing the built site to the `gh-pages` branch, rather than through
# actions/deploy-pages. That is deliberate: the deploy-pages route needs Pages
# configured with "Source: GitHub Actions", a setting a workflow token is not
# allowed to create ("Resource not accessible by integration"), and which the
# GitHub mobile app cannot reach. Pushing the branch enables Pages by itself.
#
# Only the PWA is deployed. There is no backend behind it, and that is fine:
# counting and form scoring are entirely on-device. Sessions queue locally and
# the debrief reports itself unavailable. No API key is involved in this job.

on:
  push:
    branches: ["claude/coach-ia-solo-architecture-f58qw5"]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a running deploy: a half-published site is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # Vendors the model and the WASM runtime into the artifact. Without this
      # the deployed app pulls ~20 MB from a CDN on every cold start and cannot
      # work offline — the two things vendoring exists to prevent.
      - run: npm run vendor-assets
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # Pages serves a project site from /<repo>/.
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Push to gh-pages
        working-directory: web/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Stops GitHub Pages running Jekyll over the build output.
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Site construit depuis ${GITHUB_SHA}"
          # Force-push a single-commit branch: this is a build artifact, and
          # keeping its history would add ~42 MB of binaries to the repository
          # on every deploy.
          git push -f -q \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
