[project]
name = "iacoach"
version = "0.1.0"
description = "Solo calisthenics coaching: on-device rep counting and form scoring, LLM debrief."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.69",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]
# Offline evaluation over recorded video (`vision/eval/`). Kept out of `dev`
# because it pulls ~200 MB that the API and the test suite never touch.
eval = [
    "mediapipe>=1.0",
    "opencv-python-headless>=4.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iacoach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003 flag 'ambiguous' Unicode. Here it is deliberate: user-facing
# strings are French, and the prescription parser has to match the characters
# a coach actually writes — '4×8' with a multiplication sign, '3x8–10' with an
# en dash. Rewriting them as ASCII would break the thing they exist to parse.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["iacoach"]
