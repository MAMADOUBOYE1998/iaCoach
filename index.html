<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f12" />
    <link rel="manifest" href="/iaCoach/manifest.webmanifest" />
    <title>iaCoach</title>
    <script type="module" crossorigin src="/iaCoach/assets/main-CtjTD_PA.js"></script>
    <link rel="stylesheet" crossorigin href="/iaCoach/assets/main-CmFcdDsS.css">
  </head>
  <body>
    <main id="app">
      <div id="stage">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="overlay"></canvas>
      </div>

      <section id="hud">
        <div class="metric">
          <span class="metric-value" id="reps">—</span>
          <span class="metric-label">reps validées</span>
        </div>
        <div class="metric">
          <span class="metric-value" id="confidence">—</span>
          <span class="metric-label">confiance</span>
        </div>
        <div class="metric">
          <span class="metric-value" id="fps">—</span>
          <span class="metric-label">fps</span>
        </div>
        <div class="metric">
          <span class="metric-value" id="latency">—</span>
          <span class="metric-label">ms / frame</span>
        </div>
      </section>

      <section id="last-rep" hidden>
        <h2>Dernière rep</h2>
        <ul id="last-rep-scores"></ul>
        <p id="last-rep-feedback"></p>
      </section>

      <section id="controls">
        <button id="start" type="button">Démarrer la caméra</button>
        <button id="flip" type="button" hidden>Caméra arrière</button>
        <button id="calibrate" type="button" hidden>Calibrer mon amplitude</button>
        <button id="new-set" type="button" hidden>Nouvelle série</button>
        <button id="finish" type="button" hidden>Terminer la séance</button>
        <p id="status" role="status">Prêt.</p>
      </section>

      <section id="diag-panel">
        <div id="diag-controls">
          <button id="measure" type="button" hidden>Mesurer 60 s</button>
          <button id="diag-toggle" type="button">Diagnostic</button>
          <button id="diag-copy" type="button" hidden>Copier</button>
        </div>
        <pre id="diag" hidden></pre>
      </section>

      <section id="debrief-panel" hidden>
        <h2>Débrief</h2>
        <div id="debrief"></div>
      </section>

      <section id="progress-panel">
        <h2>Amplitude au fil des séances</h2>
        <div id="progress"></div>
        <p id="sync-status" class="muted"></p>
      </section>
    </main>

  </body>
</html>
