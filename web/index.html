<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f12" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>iaCoach</title>
  </head>
  <body>
    <main id="app">
      <div id="stage">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="overlay"></canvas>
      </div>

      <section id="hud">
        <div class="metric">
          <span class="metric-value" id="reps">—</span>
          <span class="metric-label">reps validées</span>
        </div>
        <div class="metric">
          <span class="metric-value" id="confidence">—</span>
          <span class="metric-label">confiance</span>
        </div>
        <div class="metric">
          <span class="metric-value" id="fps">—</span>
          <span class="metric-label">fps</span>
        </div>
        <div class="metric">
          <span class="metric-value" id="latency">—</span>
          <span class="metric-label">ms / frame</span>
        </div>
      </section>

      <section id="last-rep" hidden>
        <h2>Dernière rep</h2>
        <ul id="last-rep-scores"></ul>
        <p id="last-rep-feedback"></p>
      </section>

      <section id="controls">
        <button id="start" type="button">Démarrer la caméra</button>
        <button id="calibrate" type="button" hidden>Calibrer mon amplitude</button>
        <p id="status" role="status">Prêt.</p>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
