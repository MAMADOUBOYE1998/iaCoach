repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      # Contracts are generated from the Pydantic models. Committing a model
      # change without regenerating the schemas is the drift this catches.
      - id: contract-schemas
        name: contract schemas are current
        entry: bash -c 'cd backend && python -m iacoach.scripts.export_schemas --check'
        language: system
        files: ^backend/src/iacoach/contracts\.py$
        pass_filenames: false

      # Same idea for the conformance fixtures: the TypeScript suite replays
      # them, so a stale golden file is a silent cross-language divergence.
      - id: conformance-fixtures
        name: conformance fixtures are current
        entry: bash -c 'cd backend && python -m iacoach.scripts.make_fixtures --check'
        language: system
        files: ^backend/src/iacoach/(counting|filter|contracts)\.py$
        pass_filenames: false
